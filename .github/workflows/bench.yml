name: bench

on:
  push:
    branches: [bench-aes-0.9]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bench:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          path: harness
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: 40489701dc71d46b4d2f06e00df23f0a7db8768e # master, v2.1.0
          path: old
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: c9ae3cfe4c57f739671c348600431e125b04f9a8 # aes-0.9 (option A)
          path: a
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: 5ddac180b3177cc50a04cff058a2754ecf017128 # aes-0.9-wipe (option B)
          path: b
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      - run: bash harness/bench/run.sh
