[package]
name = "wcbench"
version = "0.0.0"
edition = "2024"
publish = false

[features]
# the aes-0.9 branch: also benchmarks Ctr256 and reports aes::hardware_accelerated()
new = ["dep:aes"]

[dependencies]
warpcrypto = { path = "../wc" }
aes = { version = "=0.9.2", optional = true }

[profile.release]
lto = "fat"
codegen-units = 1
